# The Keycloak server versions this plugin is validated against - EVERY version it can be deployed
# onto, not just the newest.
#
# Why a list. A provider jar loads onto Keycloak's OWN classpath, so "this jar is safe" is a claim
# about a specific server build - and the fleet runs more than one at a time. As of 2026-08-21, in
# daikin-dsv/deploy (ssi/environments/clusters/):
#   ss-bedrock-prod   26.4.6            production; the jar goes here last
#   ss-qa-test        26.4.6 + 26.6.4   blue/green - BOTH StatefulSets get the jar from one values block
#   ss-infra-stage    26.4.6
#   ss-apollo-dev     26.4.6 + 26.6.4   no scim block today, but same chart
#
# Checking only the newest would leave production's version unverified during exactly the window
# where a Keycloak upgrade is in flight - which is the window where mistakes happen. Checking only
# the oldest would let an upgrade land on an unverified jar.
#
# The checks in .github/scripts/ iterate this list and fail if ANY version has a classpath collision
# or fails to load the plugin. Drop a version once no cluster runs it; add one before an upgrade
# reaches a cluster, not after.
keycloakServerVersions=26.4.6,26.6.4
